services:

  redis:
    container_name: redis
    image: redis:alpine
    restart: on-failure
    environment:
      REDIS_PASSWORD: ${SERVER_REDIS_PASSWORD:-""}
      REDIS_SAVE: ${SERVER_REDIS_SAVE_IN_SECONDS:-3600}
      REDIS_DB: ${SERVER_REDIS_DB:-0}
    ports:
      - ${SERVER_REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${SERVER_REDIS_PASSWORD}
    networks:
      - internal-network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
  
  postgres:
    container_name: postgres
    image: postgres:alpine
    restart: on-failure
    environment:
      POSTGRES_SSL_MODE: ${SERVER_POSTGRES_SSL_MODE:-"disable"}
      POSTGRES_USER: ${SERVER_POSTGRES_USER-"postgres"}
      POSTGRES_PASSWORD: ${SERVER_POSTGRES_PASSWORD-"root"}
      POSTGRES_DB: ${SERVER_POSTGRES_DB:-"test"}
      PGDATA: /var/lib/postgresql/data
    ports:
      - ${SERVER_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal-network

  api:
    container_name: api
    build:
      context: .
      target: api
      dockerfile: ./docker/api/Dockerfile
    restart: on-failure
    depends_on:
      - postgres
    ports:
      - "3100:3100"
    networks:
      - internal-network

networks:
  internal-network:
    name: go-network
    driver: bridge

volumes:
  redis-data:
  postgres-data:
